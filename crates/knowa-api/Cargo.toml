[package]
name = "knowa-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
knowa-config = { version = "0.1.0", path = "../knowa-config" }
knowa-extract = { version = "0.1.0", path = "../knowa-extract" }
knowa-index = { version = "0.1.0", path = "../knowa-index" }
knowa-model = { version = "0.1.0", path = "../knowa-model" }
knowa-store = { version = "0.1.0", path = "../knowa-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
# The write-retry test (src/write_race.rs) runs a replica on object_store's in-memory
# store behind a wrapper that loses an append race on purpose; the same versions as
# knowa-store's dependencies.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
object_store = { version = "0.14.2", default-features = false }
